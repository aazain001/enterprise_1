name: Tests

on:
  push:
    branches: [add-testing-framework]
  pull_request:
    branches: [add-testing-framework, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest
      - run: ruff check .
      - run: pytest -v